<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>줍줍</title>
<meta name="description" content="중고 리셀 매물 발굴과 수익 관리">
<meta name="theme-color" content="#F2F4F6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="줍줍">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="app.css">
<script>try{var t=localStorage.getItem('jj-theme');t=t?JSON.parse(t):'light';if(t==='dark'||(t==='system'&&matchMedia('(prefers-color-scheme: dark)').matches))document.documentElement.classList.add('dark')}catch(e){}</script>
</head>
<body>
<div class="app" id="app">
  <!-- 발굴 -->
  <section class="screen on" id="s-home">
    <div class="pad">
      <div class="top">
        <div class="logo"><i><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17L17 7M9 7h8v8"/></svg></i>줍줍</div>
        <div class="top-r">
          <span class="sample demo-only">예시 데이터</span>
          <button class="icon-btn" data-act="theme-flip" aria-label="테마 바꾸기"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 019.5 4a8 8 0 1010.5 10.5z"/></svg></button>
          <button class="icon-btn demo-only" data-act="sim-push" aria-label="알림 예시 보기"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 8a6 6 0 1112 0c0 7 3 8 3 8H3s3-1 3-8M10 20a2 2 0 004 0"/></svg><span class="dot"></span></button>
          <button class="icon-btn" data-act="refresh" id="refresh-btn" hidden aria-label="새로고침"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 11-3-6.7L21 8M21 3v5h-5"/></svg></button>
        </div>
      </div>
      <h1 class="big" id="home-title"></h1>
      <p class="sub" id="home-sub"></p>
      <div class="chips" id="filters"></div>
      <div class="sec-h"><h2>지금 사면 남는 매물</h2><span>순이익 높은 순</span></div>
      <div class="deals" id="deals"></div>
      <p class="hint" id="swipe-hint">오른쪽으로 밀면 관심, 왼쪽으로 밀면 패스</p>
    </div>
  </section>

  <!-- 재고 -->
  <section class="screen" id="s-inv">
    <div class="pad">
      <div class="top"><div class="logo">재고</div><span class="sample demo-only">예시 데이터</span></div>
      <div class="strip" id="inv-strip"></div>
      <div class="seg" id="seg"><div class="seg-ind" id="seg-ind"></div></div>
      <div id="inv-list"></div>
    </div>
  </section>

  <!-- 수익 -->
  <section class="screen" id="s-stats">
    <div class="pad">
      <div class="top"><div class="logo">수익</div><span class="sample demo-only">예시 데이터</span></div>
      <div id="stats"></div>
    </div>
  </section>

  <!-- 설정 -->
  <section class="screen" id="s-me">
    <div class="pad">
      <div class="top"><div class="logo">설정</div></div>
      <div id="me"></div>
    </div>
  </section>

  <nav class="tabbar" id="tabbar">
    <button class="tab on" data-tab="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>발굴</button>
    <button class="tab" data-tab="inv"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 7l9-4 9 4-9 4-9-4zM3 7v10l9 4 9-4V7M12 11v10"/></svg>재고</button>
    <button class="fab" data-act="add" aria-label="매물 등록"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
    <button class="tab" data-tab="stats"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>수익</button>
    <button class="tab" data-tab="me"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg>설정</button>
  </nav>

  <article class="page" id="detail"></article>
  <div class="cta pad" id="cta"></div>

  <div class="scrim" id="scrim" data-act="close-sheet"></div>
  <div class="sheet pad" id="sheet" role="dialog" aria-modal="true"></div>
  <button class="push" id="push"></button>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <input type="file" id="file" accept="image/*" hidden>
</div>
<script src="app.js"></script>
</body>
</html>
